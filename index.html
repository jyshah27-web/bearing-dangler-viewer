<html lang="en">

<title>Bearing Dangler Viewer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a shop-floor stage on the right where the card hangs; a spec rail on the left lists every option like a printer's job sheet. Single dark look on purpose (the stage reads best dark). */
:root {
  color-scheme: dark;
  --ink: #0b1220;          /* page */
  --stage: #121b2c;        /* 3D stage */
  --rail: #0f1726;         /* option rail */
  --line: #24314a;
  --fg: #e8edf6;
  --muted: #8c99b2;
  --navy: #0A1F44;         /* DYD */
  --red: #D6141B;          /* AMB */
  --steel: #c9d1db;
  --die: #f2b23a;          /* custom die chip */
  --std: #3ccf91;          /* standard cut chip */
  --focus: #7fb0ff;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
.rail { background: var(--rail); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.2px; text-wrap: balance; }
h1 .amb { color: var(--red); } h1 .dyd { color: #6f95ff; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 10px 10px; border: 1px solid var(--line); border-radius: 8px; }
.opt:hover { border-color: #3a4c6e; }
.opt[aria-pressed="true"] { border-color: var(--fg); background: #18233a; }
.opt:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.opt .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt .t b { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.opt .t span { color: var(--muted); font-size: 12px; line-height: 1.35; }
.chip { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
.chip.die { color: var(--die); border: 1px solid color-mix(in srgb, var(--die) 55%, transparent); }
.chip.std { color: #06130d; background: var(--std); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 9px 6px; font-size: 12px; line-height: 1.3; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); font-weight: 600; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.spec dt { color: var(--muted); } .spec dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mock { display: flex; flex-direction: column; gap: 6px; }
.mock img { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
.mock small { color: var(--muted); font-size: 11.5px; }
.stagewrap { position: relative; min-width: 0; background: radial-gradient(ellipse at 50% 30%, #1d2a44 0%, var(--stage) 55%, #0a101c 100%); }
canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; pointer-events: none; }
.btn { all: unset; pointer-events: auto; cursor: pointer; font-size: 13px; padding: 8px 14px; border-radius: 999px; background: rgba(11,18,32,.78); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); font-weight: 600; }
.sidebadge { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--f-mono); font-size: 12px; pointer-events: none; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
  .rail { min-width: 0; }
  .stagewrap { order: -1; height: 62vh; }
  .rail { border-right: 0; border-top: 1px solid var(--line); overflow: visible; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div>
      <h1><span class="amb">AMB</span> × <span class="dyd">DYD</span> danglers</h1>
      <p class="sub">Every dangler option in 3D. Drag to turn the card, scroll or pinch to zoom.</p>
    </div>
    <section>
      <p class="label">Option</p>
      <div class="opts" id="opts"></div>
    </section>
    <section>
      <p class="label">Pairing</p>
      <div class="seg" id="pairs">
        <button type="button" id="pair0" data-i="0">AMB front<br>DYD back</button>
        <button type="button" id="pair1" data-i="1">AMB<br>both sides</button>
        <button type="button" id="pair2" data-i="2">DYD<br>both sides</button>
      </div>
    </section>
    <section>
      <p class="label">Spec</p>
      <dl class="spec" id="spec"></dl>
    </section>
    <section class="mock" id="mock"></section>
  </aside>
  <main class="stagewrap">
    <canvas id="c" aria-label="3D view of the selected dangler"></canvas>
    <div class="loading" id="loading">Loading 3D…</div>
    <div class="sidebadge" id="sidebadge">FRONT</div>
    <div class="hud">
      <button type="button" class="btn" id="bFront">Front</button>
      <button type="button" class="btn" id="bBack">Back</button>
      <button type="button" class="btn" id="bSpin" aria-pressed="true">Spin</button>
      <button type="button" class="btn" id="bReset">Reset view</button>
    </div>
  </main>
</div>

<script>window.DANGLERS = [{"id": "round", "name": "Round photo", "cut": "Custom die", "note": "200 mm circle with hang tab, bearing photo and brand ring", "pairs": [{"front": {"img": "img/62cfd4c337.webp", "mm": [200.0, 214.0]}, "back": {"img": "img/8655409380.webp", "mm": [200.0, 214.0]}}, {"front": {"img": "img/62cfd4c337.webp", "mm": [200.0, 214.0]}, "back": {"img": "img/412b5caa03.webp", "mm": [200.0, 214.0]}}, {"front": {"img": "img/8655409380.webp", "mm": [200.0, 214.0]}, "back": {"img": "img/c7da8a439c.webp", "mm": [200.0, 214.0]}}], "mock": null}, {"id": "medallion", "name": "Medallion", "cut": "Custom die", "note": "Bearing disc with a big centre logo; DYD gets the U17 tick ring", "pairs": [{"front": {"img": "img/49607d8c4b.webp", "mm": [200.0, 218.0]}, "back": {"img": "img/1d2c31665a.webp", "mm": [200.0, 218.0]}}, {"front": {"img": "img/49607d8c4b.webp", "mm": [200.0, 218.0]}, "back": {"img": "img/9282599e8c.webp", "mm": [200.0, 218.0]}}, {"front": {"img": "img/1d2c31665a.webp", "mm": [200.0, 218.0]}, "back": {"img": "img/2e628c96e8.webp", "mm": [200.0, 218.0]}}], "mock": "img/12c9214cca.webp"}, {"id": "brandbar", "name": "Brand bar", "cut": "Custom die", "note": "Logo bar runs through the bearing and past its edge", "pairs": [{"front": {"img": "img/7321d3e318.webp", "mm": [228.0, 210.0]}, "back": {"img": "img/20acb1c2cc.webp", "mm": [228.0, 210.0]}}, {"front": {"img": "img/7321d3e318.webp", "mm": [228.0, 210.0]}, "back": {"img": "img/732de68073.webp", "mm": [228.0, 210.0]}}, {"front": {"img": "img/20acb1c2cc.webp", "mm": [228.0, 210.0]}, "back": {"img": "img/3248310167.webp", "mm": [228.0, 210.0]}}], "mock": "img/4ed63abfd5.webp"}, {"id": "headertag", "name": "Header tag", "cut": "Custom die", "note": "Signboard-style logo header with the bearing hanging below", "pairs": [{"front": {"img": "img/5be76635b7.webp", "mm": [198.0, 252.0]}, "back": {"img": "img/5458909070.webp", "mm": [198.0, 252.0]}}, {"front": {"img": "img/5be76635b7.webp", "mm": [198.0, 252.0]}, "back": {"img": "img/dd576b34d3.webp", "mm": [198.0, 252.0]}}, {"front": {"img": "img/5458909070.webp", "mm": [198.0, 252.0]}, "back": {"img": "img/a9c7879b58.webp", "mm": [198.0, 252.0]}}], "mock": "img/7c382ab3ce.webp"}, {"id": "boxface", "name": "Box face", "cut": "Custom die", "note": "Brand-box logo panel with the bearing below", "pairs": [{"front": {"img": "img/3fe3f7bbeb.webp", "mm": [192.0, 282.0]}, "back": {"img": "img/361b59e1f8.webp", "mm": [192.0, 282.0]}}, {"front": {"img": "img/3fe3f7bbeb.webp", "mm": [192.0, 282.0]}, "back": {"img": "img/44f7136f39.webp", "mm": [192.0, 282.0]}}, {"front": {"img": "img/361b59e1f8.webp", "mm": [192.0, 282.0]}, "back": {"img": "img/9e5a74f7bc.webp", "mm": [192.0, 282.0]}}], "mock": null}, {"id": "boxpack", "name": "Box + bearing", "cut": "Custom die", "note": "Logo panel with the bearing and the brand box at the bottom", "pairs": [{"front": {"img": "img/2b2112194c.webp", "mm": [197.0, 269.0]}, "back": {"img": "img/572f40af07.webp", "mm": [197.0, 269.0]}}, {"front": {"img": "img/2b2112194c.webp", "mm": [197.0, 269.0]}, "back": {"img": "img/d1aaba04b4.webp", "mm": [197.0, 269.0]}}, {"front": {"img": "img/d71a9163ee.webp", "mm": [197.0, 269.0]}, "back": {"img": "img/fb062e800d.webp", "mm": [197.0, 269.0]}}], "mock": "img/99157f6a99.webp"}];</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/":"./vendor/","three/addons/environments/":"./vendor/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const D = window.DANGLERS;
const PAIR_NAMES = ["AMB front · DYD back", "AMB both sides", "DYD both sides"];
const HOLE_FROM_TOP = { a4: 10, headertag: 14, medallion: 14, boxface: 8, boxpack: 8 };   // mm, where the string goes through
const S = 0.01;                                                   // scene units per mm
const THICK = 0.6;                                                // card thickness, mm

let state = { opt: 0, pair: 0, spin: true };
try { const saved = JSON.parse(localStorage.getItem("dangler-viewer") || "{}"); Object.assign(state, saved); } catch (e) {}
if (!(state.opt >= 0 && state.opt < D.length)) state.opt = 0;
if (!(state.pair >= 0 && state.pair < 3)) state.pair = 0;
const fromHash = D.findIndex(o => "#" + o.id === location.hash); if (fromHash >= 0) state.opt = fromHash;
const save = () => { try { localStorage.setItem("dangler-viewer", JSON.stringify(state)); } catch (e) {} };

// ---------- rail ----------
const optsEl = document.getElementById("opts");
D.forEach((o, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "opt"; b.id = "opt-" + o.id;
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span><span class="t"><b>${o.name}</b><span>${o.note}</span></span>` +
                `<span class="chip ${o.cut === "No new die" ? "std" : "die"}">${o.cut}</span>`;
  b.onclick = () => { state.opt = i; render(); };
  optsEl.appendChild(b);
});
document.querySelectorAll("#pairs button").forEach(b => b.onclick = () => { state.pair = +b.dataset.i; render(); });

// ---------- three ----------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 50);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 12; controls.enablePan = false;
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(2.5, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb6ff, 0.6); rim.position.set(-3, 1, -3); scene.add(rim);

const pivot = new THREE.Group(); scene.add(pivot);                // string top; the card swings from here
const stringMat = new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: .7 });
const string = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 8), stringMat); pivot.add(string);
const card = new THREE.Group(); pivot.add(card);

const loader = new THREE.TextureLoader();
const cache = new Map();
function tex(url) {
  if (!cache.has(url)) cache.set(url, new Promise(res => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); })));
  return cache.get(url);
}
function edgeTex(t) {                       // white silhouette of the card for the paper edge
  const c = document.createElement("canvas"); c.width = t.image.width; c.height = t.image.height;
  const g = c.getContext("2d"); g.drawImage(t.image, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#f1f1ee"; g.fillRect(0, 0, c.width, c.height);
  const e = new THREE.CanvasTexture(c); e.colorSpace = THREE.SRGBColorSpace; return e;
}
function face(t, mm) {
  const m = new THREE.MeshPhysicalMaterial({ map: t, alphaTest: 0.5, roughness: 0.38, clearcoat: 0.55, clearcoatRoughness: 0.25, side: THREE.FrontSide });
  return new THREE.Mesh(new THREE.PlaneGeometry(mm[0] * S, mm[1] * S), m);
}

let loadToken = 0, warmed = false;
async function build() {
  const o = D[state.opt], p = o.pairs[state.pair], token = ++loadToken;
  document.getElementById("loading").hidden = false;
  const [tf, tb] = await Promise.all([tex(p.front.img), tex(p.back.img)]);
  if (token !== loadToken) return;
  card.clear();
  const mmF = p.front.mm, mmB = p.back.mm, t = THICK * S;
  const f = face(tf, mmF); f.position.z = t / 2; card.add(f);
  const b = face(tb, mmB); b.rotation.y = Math.PI; b.position.z = -t / 2; card.add(b);
  const em = new THREE.MeshStandardMaterial({ map: edgeTex(tf), alphaTest: 0.5, roughness: .9, side: THREE.DoubleSide });
  for (let i = 1; i < 6; i++) { const e = new THREE.Mesh(f.geometry, em); e.position.z = t / 2 - (t * i) / 6; card.add(e); }
  // hang from the punched hole: card top sits HOLE_FROM_TOP below the pivot
  const hole = (HOLE_FROM_TOP[o.id] ?? 12) * S, h = mmF[1] * S;
  card.position.y = -(h / 2) - 0.06 + hole;
  const len = 1.6; string.scale.y = len; string.position.y = len / 2 - 0.06;
  pivot.position.y = h / 2 - 0.15;
  frame(h);
  document.getElementById("loading").hidden = true;
  if (!warmed) { warmed = true; setTimeout(() => D.forEach(o => o.pairs.forEach(q => { tex(q.front.img); tex(q.back.img); })), 400); }
}
function frame(h) {
  const dist = Math.max(3.2, h * 2.35);
  camera.position.set(0, 0.15, dist); controls.target.set(0, 0, 0); controls.update();
}

// ---------- ui state ----------
let target = null;                          // when set, ease the card to face front (0) or back (PI)
function render() {
  const o = D[state.opt];
  document.querySelectorAll(".opt").forEach((b, i) => b.setAttribute("aria-pressed", i === state.opt));
  document.querySelectorAll("#pairs button").forEach((b, i) => b.setAttribute("aria-pressed", i === state.pair));
  document.getElementById("bSpin").setAttribute("aria-pressed", state.spin);
  const p = o.pairs[state.pair];
  const sz = o.id === "a4" ? "210 × 297 mm (+3 mm bleed)" : `${Math.round(p.front.mm[0])} × ${Math.round(p.front.mm[1])} mm`;
  document.getElementById("spec").innerHTML =
    `<dt>Option</dt><dd>${String(state.opt + 1).padStart(2, "0")} ${o.name}</dd><dt>Pairing</dt><dd>${PAIR_NAMES[state.pair]}</dd>` +
    `<dt>Size</dt><dd>${sz}</dd><dt>Cutting</dt><dd>${o.cut === "No new die" ? "Guillotine + 6 mm punch" : "Custom die needed"}</dd>`;
  document.getElementById("mock").innerHTML = o.mock
    ? `<p class="label">Store mockup</p><img src="${o.mock}" alt="AI store mockup of the ${o.name} dangler hanging in a bearing shop"><small>AI-generated preview, not a print proof.</small>`
    : "";
  if (location.hash !== "#" + o.id) history.replaceState(null, "", "#" + o.id);
  save(); build();
}
document.getElementById("bSpin").onclick = () => { state.spin = !state.spin; target = null; render(); };
document.getElementById("bFront").onclick = () => { state.spin = false; target = 0; render(); };
document.getElementById("bBack").onclick = () => { state.spin = false; target = Math.PI; render(); };
document.getElementById("bReset").onclick = () => { const o = D[state.opt]; frame(o.pairs[state.pair].front.mm[1] * S); };

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock(); let yaw = 0;
const badge = document.getElementById("sidebadge");
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (state.spin && !reduce) yaw += dt * 0.55;
  else if (target !== null) {
    const d = Math.atan2(Math.sin(target - yaw), Math.cos(target - yaw)); yaw += d * Math.min(1, dt * 6);
  }
  pivot.rotation.y = yaw;
  pivot.rotation.z = reduce ? 0 : Math.sin(t * 1.1) * 0.025;     // gentle swing on the string
  card.rotation.x = reduce ? 0 : Math.sin(t * 0.8) * 0.02;
  const facing = Math.cos(yaw - Math.atan2(camera.position.x, camera.position.z)) >= 0;
  badge.textContent = facing ? "FRONT" : "BACK";
  controls.update(); renderer.render(scene, camera);
});
addEventListener("hashchange", () => { const i = D.findIndex(o => "#" + o.id === location.hash); if (i >= 0 && i !== state.opt) { state.opt = i; render(); } });
render();
</script>
